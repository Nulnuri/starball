name: LG 스타볼 예측 알림

on:
  schedule:
    # 깃헙 크론은 UTC 기준이다. 01:00 UTC = 한국시간 오전 10시.
    # 한국시간으로 바꾸려면 원하는 시각에서 9시간을 빼면 된다.
    #   오전 10시(KST) → 01:00 UTC   |   오후 2시(KST) → 05:00 UTC
    # 부하에 따라 5~30분 밀릴 수 있다. 경기가 18:30이라 여유는 충분하다.
    - cron: '0 1 * * *'

    # 마감 임박 알림. 아침 알림은 경기 8시간 전에 와서 저녁이면 묻힌다.
    # 경기 시각이 14:00 / 17:00 / 18:30 세 종류라, 각 경기가 시작 2시간쯤
    # 전에 딱 한 번 걸리도록 세 번 돈다(KST 12:00 / 15:00 / 16:30).
    # 해당 구간이 아니면 스크립트가 조용히 종료한다 — 알림이 두 번 가지 않는다.
    - cron: '0 3 * * *'      # 12:00 KST → 14:00 경기
    - cron: '0 6 * * *'      # 15:00 KST → 17:00 경기
    - cron: '30 7 * * *'     # 16:30 KST → 18:30 경기

  # Actions 탭에서 손으로 눌러 즉시 실행할 수 있게 해둔다.
  # 처음 설정한 뒤 이걸로 한 번 테스트하는 것을 권한다.
  workflow_dispatch:
    inputs:
      notify:
        description: '알림도 실제로 보낼까요? (배포·검증만 할 거면 그대로 두세요)'
        type: boolean
        default: false

# 동시에 두 번 돌아 알림이 중복 발송되는 것을 막는다.
concurrency:
  group: starball
  cancel-in-progress: false

# 웹앱 파일을 깃헙 페이지로 올리기 위해 필요하다.
permissions:
  contents: write
  pages: write
  id-token: write

env:
  # 웹앱 주소. 알림에 담기는 링크와 캘린더 파일이 이 값을 쓴다.
  # 주소가 바뀌면 여기만 고치면 된다.
  SITE_URL: https://starball-9oj.pages.dev

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # 얕은 클론이면 아래 rebase 가 실패한다. 저장소가 작으니 전부 받는다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 테스트
        # 규칙 테스트(학습↔운영 일치, 문항별 출처, 구장 팩터 중복 금지)가
        # 여기서 돌아야 의미가 있다. 로컬에서만 돌리면 아무도 안 지킨다.
        # 실패하면 잡을 세운다 — 틀린 값을 배포하는 것보다 낫다.
        run: |
          fail=0
          for t in test_starball test_push test_train; do
            echo "── $t ──"
            python $t.py || fail=1
          done
          if [ $fail -ne 0 ]; then
            echo "::error::테스트 실패. 예측을 배포하지 않습니다."
            exit 1
          fi

      - name: 알림 토픽 확인
        # 공개 저장소라 코드에 박힌 기본 토픽은 누구나 볼 수 있다.
        # 그 토픽으로 발송하면 남이 가짜 알림을 보낼 수 있으므로,
        # Secret 을 반드시 등록하게 막는다.
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::NTFY_TOPIC Secret 이 없습니다. 저장소 Settings →"
            echo "::error::Secrets and variables → Actions 에서 등록하세요."
            echo "::error::공개 저장소에서 기본 토픽을 쓰면 남이 알림을 보낼 수 있습니다."
            exit 1
          fi
          echo "토픽 Secret 확인됨 (${#NTFY_TOPIC}자)"

      - name: 마감 임박 알림
        # 손으로 돌린 실행에서는 기본적으로 보내지 않는다.
        # 코드를 고칠 때마다 검증하려고 workflow_dispatch 를 돌렸는데, 그때마다
        # 실제 알림이 나갔다. 2026-09-04 하루에 같은 알림을 다섯 번 보냈다.
        # 지인에게 공유한 뒤였다면 모두에게 다섯 번씩 갔을 것이다.
        # 아침 실행(01:00 UTC)이 아닐 때만 돈다. 구간 밖이면 스크립트가
        # 스스로 건너뛰므로 여기서 시각을 따로 따지지 않는다.
        if: (github.event.schedule != '0 1 * * *') && (github.event_name != 'workflow_dispatch' || inputs.notify)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python starball_predictor.py --reminder
          echo "마감 임박 알림 단계 완료"

      - name: 마감 임박 웹 푸시 (지인용)
        # 손으로 돌린 실행에서는 기본적으로 보내지 않는다.
        # 코드를 고칠 때마다 검증하려고 workflow_dispatch 를 돌렸는데, 그때마다
        # 실제 알림이 나갔다. 2026-09-04 하루에 같은 알림을 다섯 번 보냈다.
        # 지인에게 공유한 뒤였다면 모두에게 다섯 번씩 갔을 것이다.
        # ntfy 는 내가 쓰는 채널이고 이쪽은 웹앱 구독자용이다. 둘은 독립이라
        # 한쪽이 실패해도 다른 쪽은 가야 한다.
        # 경기 1~3시간 전이 아니면 스크립트가 스스로 건너뛴다.
        continue-on-error: true
        if: (github.event.schedule != '0 1 * * *') && (github.event_name != 'workflow_dispatch' || inputs.notify)
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
        run: python push_send.py --site "$SITE_URL" --reminder

      - name: 예측 실행 및 푸시 발송
        # 손으로 돌린 실행에서는 기본적으로 보내지 않는다.
        # 코드를 고칠 때마다 검증하려고 workflow_dispatch 를 돌렸는데, 그때마다
        # 실제 알림이 나갔다. 2026-09-04 하루에 같은 알림을 다섯 번 보냈다.
        # 지인에게 공유한 뒤였다면 모두에게 다섯 번씩 갔을 것이다.
        # 아침 실행에서만 전체 예측을 보낸다.
        if: github.event.schedule == '0 1 * * *' || inputs.notify
        env:
          # 저장소 Settings → Secrets and variables → Actions 에 등록한 값.
          # 등록하지 않으면 스크립트 기본 토픽으로 발송된다.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e
          # --home-only 를 쓰면 안 된다. 스타볼 미션은 원정 경기에도 열린다
          # (2026-08-28 LG@롯데 원정 경기에서 확인). 잔여 시즌 기준으로
          # 원정이 54%라, 켜두면 절반 이상을 놓친다.
          python starball_predictor.py --ntfy
          code=$?
          set -e
          echo "종료 코드: $code"
          case $code in
            0)
              echo "정상 종료 (예측 발송 완료, 또는 홈경기가 아니거나 경기 없는 날)"
              exit 0 ;;
            75)
              echo "::notice::선발 예고 전이라 예측을 건너뛰었습니다. 실패가 아닙니다."
              exit 0 ;;
            *)
              echo "::error::예측 실패 (코드 $code)"
              exit $code ;;
          esac

      - name: 웹앱 데이터 갱신 (지난 경기 채점 + 오늘 예측)
        # 알림이 실패해도 웹앱은 갱신한다. 둘은 독립적이다.
        # 다만 하루 한 번(아침)이면 충분하다 — 마감 알림 실행에서 또 돌리면
        # 네이버에 하루 4배로 요청하면서 얻는 게 없다.
        if: always() && (github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          set +e
          python webdata.py both
          code=$?
          set -e
          echo "webdata 종료 코드: $code"
          # 0 = 정상(경기 없는 날 포함), 75 = 선발 예고 전. 그 밖은 진짜 실패다.
          # 예전에는 무조건 exit 0 이라, webdata 가 죽어도 초록불이 뜨고
          # 앱은 낡은 데이터를 계속 보여줬다. 아무도 알 수 없었다.
          case $code in
            0)  ;;
            75) echo "::notice::선발 예고 전이라 예측을 건너뛰었습니다." ;;
            *)  echo "::error::웹앱 데이터 갱신 실패 (코드 $code)"; exit $code ;;
          esac

      - name: 경기 로그 누적 (내년 학습 재료)
        # 새 경기만 받아 덧붙인다. 요청이 몇 건뿐이라 매일 돌려도 부담이 없다.
        # 이걸 안 돌리면 학습 데이터가 그날로 멈춘다 — 실제로 8/29 에 멈춰 있었다.
        # 시즌이 끝난 뒤 train_outcome.py 로 이 파일을 학습해 계수를 갱신한다.
        continue-on-error: true
        if: always() && (github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch')
        run: python build_gamelog.py

      - name: 캘린더 구독 파일 생성
        # 아이폰은 애플 정책상 홈 화면에 추가된 웹앱에만 웹 푸시를 허용한다.
        # 홈 화면 추가를 안 하는 사람용 우회로다 — 기기 기본 캘린더가 알린다.
        continue-on-error: true
        if: always() && (github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch')
        run: python make_ics.py --site "$SITE_URL"

      - name: 아침 웹 푸시 (지인용)
        # 손으로 돌린 실행에서는 기본적으로 보내지 않는다.
        # 코드를 고칠 때마다 검증하려고 workflow_dispatch 를 돌렸는데, 그때마다
        # 실제 알림이 나갔다. 2026-09-04 하루에 같은 알림을 다섯 번 보냈다.
        # 지인에게 공유한 뒤였다면 모두에게 다섯 번씩 갔을 것이다.
        # webdata 뒤에 둔다. 그래야 방금 계산한 today.json 을 보낸다.
        # 앞에 두면 어제 값을 보내고, 스크립트가 날짜를 확인해 아무것도
        # 보내지 않는 편이 낫지만 그러면 알림이 하루 빠진다.
        continue-on-error: true
        if: always() && (github.event.schedule == '0 1 * * *' || inputs.notify)
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
        run: python push_send.py --site "$SITE_URL"

      - name: 갱신된 데이터 커밋
        if: always() && (github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 파일을 하나씩 지정하면 없을 때 git add 가 실패해 잡 전체가 죽는다.
          # 디렉터리째 넘기면 있는 것만 담는다.
          git add -A web

          # 경기 로그는 루트에 있어서 'web' 만 담으면 빠진다. 그러면 매일 받아도
          # 커밋이 안 돼 데이터가 하나도 쌓이지 않는다. 내년 학습의 재료이므로
          # 반드시 같이 담는다. --ignore-unmatch 로 파일이 없어도 죽지 않게 한다.
          git add -A -- 'gamelog_*.json' || true

          # 바뀐 게 없으면 커밋하지 않는다(휴식일에 빈 커밋이 쌓이는 것 방지).
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
            exit 0
          fi
          git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)"

          # 사용자가 깃헙 웹에서 파일을 고쳤으면(문항 정의 등) push 가 거부된다.
          # 한 번 받아서 얹고 다시 시도한다.
          for i in 1 2 3; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 거부 — 원격 변경을 받아 다시 시도 ($i/3)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "::error::push 를 3번 시도했으나 실패했습니다."
          exit 1

      - name: Cloudflare Pages 배포
        # 부가 배포다. 깃헙 페이지만으로도 앱은 완전히 돌아가므로, 여기가
        # 실패해도 잡을 죽이지 않는다(continue-on-error). 안 그러면 Cloudflare
        # 설정 문제 하나로 매일 빨간 X 가 뜨고, 정작 알림·데이터는 정상인데
        # 사용자가 고장으로 오해한다.
        continue-on-error: true
        if: always() && (github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Cloudflare 토큰이 없어 건너뜁니다(깃헙 페이지만 배포)."
            exit 0
          fi
          # ACCOUNT_ID 는 없어도 된다 — 토큰이 계정 하나에만 걸려 있으면
          # wrangler 가 스스로 찾는다. 여러 계정에 걸린 토큰이면 실패하면서
          # 후보 목록을 찍어주니, 그때 Secret 을 추가하면 된다.
          # CI 에서는 프로젝트를 자동 생성해주지 않는다. 없으면 만들고 배포한다.
          # 이미 있으면 create 가 실패하므로 목록으로 먼저 확인한다.
          if ! npx --yes wrangler@latest pages project list 2>/dev/null                | grep -qw starball; then
            echo "프로젝트가 없어 생성합니다"
            npx --yes wrangler@latest pages project create starball               --production-branch=main
          fi
          npx --yes wrangler@latest pages deploy web             --project-name=starball --branch=main --commit-dirty=true

      - name: 배포 점검
        # 배포가 끝난 뒤 실제로 오늘 데이터가 올라갔는지 본다.
        # 단계마다 초록불이어도 화면이 낡아 있을 수 있다 — 실제로 겪었다.
        continue-on-error: true
        if: always() && (github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          python - <<'PY'
          import json, sys, urllib.request
          from datetime import datetime, timedelta, timezone
          KST = timezone(timedelta(hours=9))
          today = datetime.now(KST).date().isoformat()
          try:
              req = urllib.request.Request(
                  "https://starball-9oj.pages.dev/today.json",
                  headers={"User-Agent": "Mozilla/5.0"})
              d = json.load(urllib.request.urlopen(req, timeout=25))
          except Exception as e:
              print(f"::warning::배포 점검 실패({e})")
              sys.exit(0)
          when = (d.get("generated") or "")[:10]
          date = (d.get("game") or {}).get("date")
          print(f"올라간 데이터: 경기 {date} · 생성 {when}")
          if when != today:
              print(f"::warning::배포된 데이터가 오늘({today}) 것이 아닙니다")
          PY

      - name: 깃헙 페이지에 웹앱 배포
        if: always() && (github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: predict
    # 아티팩트를 올린 실행에서만 배포한다. 마감 알림 실행에는 올릴 게 없다.
    if: always() && (github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
