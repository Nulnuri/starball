<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131011">
<title>스타볼 예측기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #131011; --surface: #1C1719; --surface-2: #241E21;
    --line: #2A2326; --line-2: #3D3438;
    --ink: #EDE6E8; --ink-soft: #A79BA0; --ink-faint: #7A6F74; --ink-dim: #5C5257;
    --accent: #F0245C; --warn: #D9A15C; --ok: #5FBF88; --bad: #B5646F;
    --cool: #6FB8D9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ground); }
  body {
    color: var(--ink);
    font-family: "IBM Plex Sans KR", system-ui, sans-serif;
    font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .num { font-family: Archivo, system-ui, sans-serif; font-variant-numeric: tabular-nums; }

  #app { max-width: 480px; margin: 0 auto; min-height: 100vh;
         display: flex; flex-direction: column; }
  main { flex-grow: 1; padding: max(24px, env(safe-area-inset-top)) 20px 16px;
         display: flex; flex-direction: column; gap: 14px; }

  .card { background: var(--surface); border: 1px solid var(--line);
          border-radius: 4px; }
  .pad { padding: 14px 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .col { display: flex; flex-direction: column; }
  .rule { height: 1px; background: var(--line); }
  .grow { flex-grow: 1; }
  .muted { color: var(--ink-faint); }
  .small { font-size: 12px; }
  .tiny { font-size: 11px; line-height: 1.5; }

  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  /* 라틴 서체용 자간이라 한글에는 넓어 보인다. .ko 로 되돌린다. */
  .eyebrow.ko { font-family: inherit; font-size: 13px; letter-spacing: -0.01em; }
  .eyebrow { font-family: Archivo, sans-serif; font-size: 11px; font-weight: 600;
             letter-spacing: .16em; color: var(--accent); }

  /* 미션 */
  .mission { border-left: 3px solid var(--accent); padding: 13px 16px;
             display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mission .tag { font-family: Archivo, sans-serif; font-size: 10px; font-weight: 600;
                  letter-spacing: .12em; color: #6E6367; }
  .mission .pick { font-size: 27px; font-weight: 600; letter-spacing: -.01em; }
  .mission .p { font-size: 14px; color: var(--ink-faint); min-width: 40px; text-align: right; }

  .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: flex; }
  .bar > i { display: block; background: var(--warn); }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px;
         min-height: 52px; border-radius: 4px; background: var(--accent);
         color: #fff; font-size: 15px; font-weight: 600; text-decoration: none; }
  .btn:active { filter: brightness(.9); }

  /* 탭 */
  nav { display: flex; gap: 4px; padding: 6px 20px max(10px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--surface-2); background: var(--ground);
        position: sticky; bottom: 0; }
  nav button { flex-grow: 1; min-height: 48px; background: none; border: 0;
               color: var(--ink-dim); font: inherit; font-size: 10px;
               display: flex; flex-direction: column; align-items: center;
               justify-content: center; gap: 3px; cursor: pointer; padding: 0; }
  nav button[aria-current="page"] { color: var(--accent); }

  /* 접이식 */
  details { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
  details > summary { list-style: none; cursor: pointer; padding: 13px 16px;
                      min-height: 48px; display: flex; align-items: center;
                      justify-content: space-between; gap: 10px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary .chev { transition: transform .18s; color: var(--ink-faint); }
  details[open] > summary .chev { transform: rotate(180deg); }
  details > summary + * { border-top: 1px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { details > summary .chev { transition: none; } }

  .pill { display: inline-flex; align-items: center; justify-content: center;
          width: 20px; height: 20px; border-radius: 50%; flex: 0 0 auto; }
  .strike { color: var(--bad); text-decoration: line-through; }
  .note { display: flex; gap: 7px; align-items: flex-start;
          background: #2A1D12; border-left: 2px solid var(--warn);
          padding: 9px 11px; border-radius: 0 3px 3px 0; color: var(--warn); }
  /* 알림 칸. nav 바로 위에 붙어 탭을 바꿔도 자리가 안 흔들린다. */
  #notif:empty { display: none; }
  .notif { display: flex; align-items: center; gap: 10px; justify-content: space-between;
           padding: 10px 20px; border-top: 1px solid var(--surface-2);
           background: var(--surface); }
  .notif.on { color: var(--ok); }
  .notif .btn { flex: 0 0 auto; padding: 7px 13px; min-height: 34px; }
  .linky { background: none; border: 0; color: var(--ink-dim); font: inherit;
           text-decoration: underline; cursor: pointer; padding: 6px 2px;
           min-height: 34px; flex: 0 0 auto; }
  .notif a { color: var(--accent); }

  /* 계산 시각 */
  .stamp { display: flex; align-items: center; gap: 5px; color: var(--ink-faint);
           margin: -4px 0 2px; }

  /* 확신도 배지 */
  .conf { display: inline-flex; align-items: center; align-self: flex-start;
          font-size: 10px; line-height: 1.4; padding: 2px 6px; border-radius: 3px;
          background: var(--surface-2); color: var(--ink-dim); margin-top: 2px; }
  .conf.hi { background: #16321F; color: var(--ok); }
  .conf.band { background: var(--ok); color: #0B1F13; font-weight: 600; }

  /* 근거 */
  .why { background: var(--surface); border: 1px solid var(--line);
         border-top: 0; border-radius: 0 0 4px 4px; padding: 9px 14px 11px;
         margin: -9px 0 0 3px; }
  .whyrow { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .whyrow .wl { flex: 0 0 108px; }
  .whyrow .wv { flex: 0 0 46px; text-align: right; color: var(--ink-dim); }
  .wbar { flex-grow: 1; height: 4px; background: var(--surface-2);
          border-radius: 2px; display: flex; }
  .wbar i { border-radius: 2px; }
  .wbar i.up { background: var(--ok); }
  .wbar i.dn { background: var(--bad); }

  .hidden { display: none !important; }
  svg { flex: 0 0 auto; }
</style>
</head>
<body>
<div id="app">
  <main id="view"><p class="muted small">불러오는 중…</p></main>
  <section id="notif"></section>

  <nav>
    <button data-tab="today" aria-current="page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v9h14v-9"/></svg>오늘</button>
    <button data-tab="why">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M21 19H3"/></svg>근거</button>
    <button data-tab="log">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>기록</button>
  </nav>
</div>

<script>
const LG_APP = "https://www.lgtwins.com/starball";
const view = document.getElementById("view");
let D = null, H = null, tab = "today";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = v => v == null ? "—" : (v * 100).toFixed(0) + "%";
const pct1 = v => v == null ? "—" : (v * 100).toFixed(1) + "%";

const chev = `<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
const warnIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>`;

async function load() {
  const bust = "?v=" + Date.now();
  const [t, h] = await Promise.all([
    fetch("today.json" + bust).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch("history.json" + bust).then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  D = t; H = h;
  render();
}

function render() {
  document.querySelectorAll("nav button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  view.innerHTML = tab === "today" ? viewToday()
                 : tab === "why" ? viewWhy()
                 : viewLog();
  view.scrollTop = 0;
}

/* ── 오늘 ─────────────────────────────────────────────── */

// 계산 시각. 이게 안 보이면 매번 같은 값을 박아둔 것처럼 보인다.
function stampRow() {
  const t = D && D.generated;
  if (!t) return "";
  const d = new Date(t);
  if (isNaN(d)) return "";
  const when = `${d.getMonth() + 1}월 ${d.getDate()}일 `
    + `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const skill = D.outcomeSkill && D.outcomeSkill.validation;
  const learned = (D.missions || []).some(m => m.model === "learned");
  const note = learned && skill
    ? ` · 학습 모델 (과거 ${skill.model}% 적중)`
    : "";
  const min = Math.round((Date.now() - d.getTime()) / 60000);
  const ago = min < 1 ? "방금" : min < 60 ? `${min}분 전`
            : min < 1440 ? `${Math.floor(min / 60)}시간 전` : `${Math.floor(min / 1440)}일 전`;
  return `<div class="stamp tiny">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/>
      <path d="M12 7v5l3 2"/></svg>
    <span>${when} 계산 (${ago})${note}</span></div>`;
}

// 확신도 배지. 문턱과 적중률은 학습 때 실측으로 잰 값이다.
// '높은 날' 이 실제로 더 잘 맞는다는 걸 숫자로 같이 보여준다.
// 왜 이 값이 나왔는지. 근거 없이 숫자만 보여주면 믿을 이유가 없다.
// 각 요인이 얼마나 밀었는지는 모델 계수에서 직접 계산한 값이다.
function whyRow(m) {
  const rs = m.reasons || [];
  if (!rs.length && !m.fixedNote) return "";
  if (!rs.length) {
    return `<div class="why"><span class="tiny muted">${esc(m.fixedNote)}</span></div>`;
  }
  const max = Math.max(...rs.map(r => Math.abs(r.weight))) || 1;
  const bars = rs.map(r => {
    const pos = r.weight > 0;
    const w = Math.max(6, Math.round(Math.abs(r.weight) / max * 100));
    return `<div class="whyrow">
      <span class="tiny muted wl">${esc(r.label)}</span>
      <span class="tiny num wv">${esc(r.value)}</span>
      <span class="wbar"><i class="${pos ? "up" : "dn"}" style="width:${w}%"></i></span>
    </div>`;
  }).join("");
  const blend = m.blend
    ? `<div class="tiny muted" style="margin-top:5px">
         팀 성적 ${(m.blend.teamWin * 100).toFixed(0)}% 를
         ${((1 - m.blend.model) * 100).toFixed(0)}% 반영
         ${m.blend.modelPick !== m.pick
            ? ` · 모델만 보면 ${esc(m.blend.modelPick)}` : ""}
       </div>` : "";
  return `<div class="why">
    <div class="tiny muted" style="margin-bottom:4px">이 값이 나온 이유</div>
    ${bars}${blend}</div>`;
}

function confBadge(m) {
  if (!m.confidence) return "";
  // 목표 구간(70/75/80%)에 드는 날은 그것을 앞세운다. 문턱과 실측치는
  // 학습 때 잰 값이라, 표시한 숫자가 실제로 지켜진 약속이다.
  if (m.band) {
    return `<span class="conf band">${m.band}% 구간 · 과거 실측 ${m.bandAccuracy}%</span>`;
  }
  const strong = m.confidence === "매우 높음" || m.confidence === "높음";
  const acc = m.tierAccuracy ? ` · 이런 날 과거 ${m.tierAccuracy}%` : "";
  return `<span class="conf ${strong ? "hi" : ""}">확신도 ${esc(m.confidence)}${acc}</span>`;
}

function viewToday() {
  if (!D) return empty("오늘은 LG 경기가 없습니다", "경기가 있는 날 아침에 갱신됩니다.");
  const g = D.game, j = D.joint;
  const away = g.lgIsHome ? g.opp : g.lg, home = g.lgIsHome ? g.lg : g.opp;
  const balls = D.starballs ?? 0, goal = D.goal ?? 7;

  return `
  <div class="row" style="align-items:baseline">
    <span class="eyebrow ko">스타볼 예측기</span>
    <span class="small muted num">${esc(g.date.slice(5).replace("-", "월 "))}일</span>
  </div>
  ${stampRow()}

  <div class="card pad col" style="gap:10px">
    <div class="row">
      <div class="col" style="gap:2px">
        <strong>${esc(away)}</strong><span class="tiny muted">원정</span>
      </div>
      <span class="num small" style="color:var(--ink-dim);letter-spacing:.1em">VS</span>
      <div class="col" style="gap:2px;align-items:flex-end">
        <strong>${esc(home)}</strong><span class="tiny muted">홈</span>
      </div>
    </div>
    <div class="rule"></div>
    <div class="small muted num">${esc(g.stadium)} · ${esc(g.time)}</div>
  </div>

  <div class="col" style="gap:8px">
    ${D.missions.map(m => `
      <div class="card mission">
        <div class="col" style="gap:3px">
          <span class="tag">MISSION ${m.n}</span>
          <span class="small muted">${esc(m.label)}</span>
          ${confBadge(m)}
        </div>
        <div style="display:flex;align-items:baseline;gap:12px">
          <span class="pick">${esc(m.pick)}</span>
          <span class="num p">${pct(m.prob)}</span>
        </div>
      </div>
      ${whyRow(m)}`).join("")}
  </div>

  <div class="card pad col" style="gap:10px">
    <div class="row" style="align-items:baseline">
      <span class="small muted">세 개 모두 적중할 확률</span>
      <span class="num" style="font-size:24px;font-weight:700;color:var(--warn)">${pct1(j.prob)}</span>
    </div>
    <div class="bar"><i style="width:${Math.max(1, (j.prob || 0) * 100).toFixed(1)}%"></i></div>
    ${j.baseline != null ? `<div class="note tiny">${warnIcon}
      <span>리그 평균대로 찍어도 ${pct1(j.baseline)}입니다. 모델이 더 낫다는 근거는 아직 없습니다.</span></div>` : ""}
  </div>

  <div class="row" style="padding:0 2px">
    <span class="small muted">스타볼 <b class="num" style="color:var(--ink)">${balls}</b> / ${goal}</span>
    <div style="display:flex;gap:5px">${
      Array.from({ length: goal }, (_, i) =>
        `<span style="width:14px;height:14px;border-radius:50%;${
          i < balls ? "background:var(--accent)" : "border:1px solid var(--line-2)"}"></span>`).join("")}</div>
  </div>

  <div class="grow"></div>
  <a class="btn" href="${LG_APP}" target="_blank" rel="noopener">LG 트윈스 앱 열기
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg></a>`;
}

/* ── 근거 ─────────────────────────────────────────────── */
function viewWhy() {
  if (!D) return empty("표시할 근거가 없습니다", "오늘 경기가 있어야 계산됩니다.");
  const r = D.reasoning, s = r.starters;

  const sp = (x, side) => `
    <div class="col" style="gap:6px">
      <div class="row" style="align-items:baseline">
        <span><b>${esc(x.name)}</b> <span class="muted small">· ${esc(side)}</span></span>
        <span class="num small muted">ERA ${x.era.toFixed(2)}</span>
      </div>
      ${x.vs ? `<div class="row tiny"><span class="muted">${esc(x.vs.foe)}전</span>
        <span class="num muted">${x.vs.era.toFixed(2)} · ${x.vs.ip}이닝</span></div>` : ""}
      ${x.recent ? `<div class="row tiny"><span class="muted">최근 ${x.recent.starts}등판</span>
        <span class="num muted">${x.recent.era.toFixed(2)} · WHIP ${x.recent.whip.toFixed(2)}</span></div>` : ""}
      ${x.spot ? `<div class="note tiny">${warnIcon}<span>최근 등판이 대부분 구원입니다. 임시 선발이라 소화 이닝이 불확실합니다.</span></div>` : ""}
    </div>`;

  return `
  <div class="row" style="align-items:baseline">
    <h1>이 값이 나온 이유</h1>
    <span class="small muted">${esc(D.game.lg)} ${D.game.lgIsHome ? "vs" : "@"} ${esc(D.game.opp)}</span>
  </div>

  <details open>
    <summary><span style="display:flex;align-items:center;gap:9px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v5c0 4.5 3.2 8.2 8 9 4.8-.8 8-4.5 8-9V7z"/><path d="m9 12 2 2 4-4"/></svg>
      <b class="small">이 추천을 얼마나 믿을까</b></span>${chev}</summary>
    <div class="pad col" style="gap:11px">
      ${D.missions.filter(m => m.skill).map(m => trustRow(m)).join("")}
      <div class="tiny muted" style="border-top:1px solid var(--surface-2);padding-top:9px">
        LG 96경기를 그날 시점 데이터로 다시 계산해 잰 값입니다.
        <b>흔한 값</b>은 아무 계산 없이 그동안 가장 많이 나온 값만 매번
        똑같이 찍었을 때입니다. 예측이 그보다 못하면 그 문항은 사실상
        운이라는 뜻입니다.
      </div>
    </div>
  </details>

  <details open>
    <summary><span style="display:flex;align-items:center;gap:9px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"><path d="M4 20 20 4"/><circle cx="6.5" cy="17.5" r="2.5"/></svg>
      <b class="small">선발 매치업</b></span>${chev}</summary>
    <div class="pad col" style="gap:13px">
      ${sp(s.lg, D.game.lg)}<div class="rule"></div>${sp(s.opp, D.game.opp)}
    </div>
  </details>

  ${r.park ? `<details open>
    <summary><span style="display:flex;align-items:center;gap:9px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20a9 9 0 0 1 18 0"/><path d="M3 20h18"/><path d="M12 11V4"/></svg>
      <b class="small">구장 · ${esc(r.park.name)}</b></span>${chev}</summary>
    <div class="pad col" style="gap:8px">
      <div class="row" style="align-items:baseline">
        <span class="small muted">홈런 팩터 (적용값)</span>
        <span class="num" style="font-size:20px;font-weight:600;color:${r.park.applied < 1 ? "var(--cool)" : "var(--accent)"}">${r.park.applied.toFixed(3)}</span>
      </div>
      <div class="tiny muted">실측 ${r.park.raw.toFixed(3)} → 표본 노이즈를 감안해 1.0 쪽으로 축소한 값입니다.
        ${r.park.applied < 1 ? "홈런이 덜 나오는 구장입니다." : "홈런이 잘 나오는 구장입니다."}</div>
    </div>
  </details>` : ""}

  <details>
    <summary><span style="display:flex;align-items:center;gap:9px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6"/><circle cx="12" cy="14" r="6"/></svg>
      <b class="small">불펜</b></span>
      <span style="display:flex;align-items:center;gap:10px"><span class="num tiny muted">RA9</span>${chev}</span></summary>
    <div class="pad col" style="gap:6px">
      <div class="row small"><span class="muted">${esc(D.game.lg)}</span><span class="num">${r.bullpen.lg?.toFixed(2) ?? "—"}</span></div>
      <div class="row small"><span class="muted">${esc(D.game.opp)}</span><span class="num">${r.bullpen.opp?.toFixed(2) ?? "—"}</span></div>
      <div class="tiny muted">선발을 뺀 구원진만의 9이닝당 실점입니다.</div>
    </div>
  </details>

  <details>
    <summary><span style="display:flex;align-items:center;gap:9px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 16 5-5 4 4 7-7"/><path d="M20 8v4h-4"/></svg>
      <b class="small">최근 페이스 · 상대 전적</b></span>${chev}</summary>
    <div class="pad col" style="gap:6px">
      <div class="row small"><span class="muted">${esc(D.game.lg)} 최근 5경기</span><span>${esc(r.form.lg || "—")}</span></div>
      <div class="row small"><span class="muted">${esc(D.game.opp)} 최근 5경기</span><span>${esc(r.form.opp || "—")}</span></div>
      <div class="row small"><span class="muted">올 시즌 상대 전적</span>
        <span class="num">${r.h2h.w}승 ${r.h2h.l}패 ${r.h2h.d}무</span></div>
    </div>
  </details>

  ${(D.warnings || []).length ? `<div class="card pad col" style="gap:7px">
    <span class="tiny" style="color:var(--warn)">주의</span>
    ${D.warnings.map(w => `<div class="tiny muted">· ${esc(w)}</div>`).join("")}
  </div>` : ""}

  <a href="docs/" style="display:flex;align-items:center;justify-content:space-between;
     min-height:48px;padding:0 16px;background:var(--surface);border:1px solid var(--line);
     border-radius:4px;color:var(--ink);text-decoration:none;font-size:13px">
    <span>이 도구가 어떻게 계산하는지</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
  </a>

  <div class="tiny" style="color:var(--ink-dim);border-top:1px solid var(--surface-2);padding-top:12px">
    네이버 스포츠 공개 기록으로 계산한 확률입니다. 결과를 보장하지 않습니다.
  </div>`;
}

/* ── 기록 ─────────────────────────────────────────────── */
function viewLog() {
  if (!H || !H.games?.length) return empty("아직 기록이 없습니다", "경기가 끝나면 채점해서 쌓입니다.");
  const balls = H.starballs ?? 0, goal = H.goal ?? 7;
  const settled = H.settled || 0;
  const perGame = settled ? balls / settled : 0;
  const need = Math.max(0, goal - balls);

  return `
  <h1>내 기록</h1>

  <div class="card pad col" style="gap:12px">
    <div class="row" style="align-items:baseline">
      <span class="small muted">스타볼</span>
      <span style="display:flex;align-items:baseline;gap:4px">
        <b class="num" style="font-size:32px;color:var(--accent)">${balls}</b>
        <span class="num" style="font-size:16px;color:var(--ink-dim)">/ ${goal}</span></span>
    </div>
    <div style="display:flex;gap:6px">${
      Array.from({ length: goal }, (_, i) =>
        `<i style="flex-grow:1;height:6px;border-radius:3px;background:${i < balls ? "var(--accent)" : "var(--surface-2)"}"></i>`).join("")}</div>
    <div class="tiny muted">${need ? `응모까지 ${need}개 남음${
      perGame > 0 ? ` · 이 속도면 약 ${Math.ceil(need / perGame)}경기` : ""}` : "응모 가능합니다"}</div>
  </div>

  <div style="display:flex;gap:8px">
    <div class="card pad col grow" style="gap:4px">
      <span class="tiny muted">정산된 경기</span>
      <b class="num" style="font-size:22px">${settled}</b>
    </div>
    <div class="card pad col grow" style="gap:4px">
      <span class="tiny muted">세 개 다 적중</span>
      <span style="display:flex;align-items:baseline;gap:6px">
        <b class="num" style="font-size:22px;color:var(--accent)">${balls}</b>
        <span class="num tiny muted">${pct1(H.rate)}</span></span>
    </div>
  </div>

  ${H.replayed ? `<div class="note tiny">${warnIcon}<span>${H.replayed}경기는 과거 재현이고 실사용 기록은 ${H.live}경기입니다. 재현은 그날 시점 데이터로 다시 계산한 것이라 참고치입니다.</span></div>` : ""}

  <div class="card pad col" style="gap:7px">
    <span class="tiny muted">문항별 적중</span>
    ${Object.values(H.perMission || {}).map(m => `
      <div class="row small">
        <span class="muted">${esc(m.label)}</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span style="width:70px;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;display:flex">
            <i style="width:${(m.hit / m.total * 100).toFixed(0)}%;background:var(--ink-faint)"></i></span>
          <span class="num tiny" style="min-width:38px;text-align:right">${m.hit}/${m.total}</span></span>
      </div>`).join("")}
  </div>

  <span class="tiny" style="color:var(--ink-dim);letter-spacing:.04em">지난 추천</span>
  <div class="col" style="gap:6px">
    ${H.games.map(logRow).join("")}
  </div>`;
}

function logRow(g) {
  const keys = Object.keys(g.picks);
  const picks = keys.map(k => esc(g.picks[k]));
  if (!g.settled) {
    return `<div class="card" style="padding:11px 13px;display:flex;align-items:center;gap:11px">
      <span class="pill" style="border:1px solid var(--line-2)"></span>
      <span class="grow col" style="gap:3px">
        <span class="row"><b class="small">${esc(g.date.slice(5))} ${g.home ? "vs" : "@"} ${esc(g.opp)}</b>
          <span class="tiny muted">경기 전</span></span>
        <span class="tiny muted num">${picks.join(" · ")}</span></span></div>`;
  }
  const ok = g.earned;
  const miss = keys.filter(k => !g.hits[k]);
  const line = keys.map(k =>
    g.hits[k] ? `<span>${esc(g.picks[k])}</span>` : `<span class="strike">${esc(g.picks[k])}</span>`).join(" · ");
  const actual = miss.length
    ? `<span class="tiny" style="color:var(--ink-dim)">→ ${miss.map(k => esc(g.actual[k])).join(" · ")}</span>` : "";
  return `<div class="card" style="padding:11px 13px;display:flex;align-items:center;gap:11px">
    <span class="pill" style="background:${ok ? "#1B3326" : "#2A1A1D"}">
      ${ok ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>`
           : `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--bad)" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>`}</span>
    <span class="grow col" style="gap:3px">
      <span class="row">
        <b class="small">${esc(g.date.slice(5))} ${g.home ? "vs" : "@"} ${esc(g.opp)}</b>
        <span class="tiny" style="color:${ok ? "var(--ok)" : "var(--ink-dim)"}">${
          ok ? "스타볼 +1" : `${g.score.lg}-${g.score.opp}`}</span></span>
      <span class="tiny muted num" style="display:flex;gap:6px;flex-wrap:wrap">${line}${actual}</span>
    </span></div>`;
}

function trustRow(m) {
  const s = m.skill, good = s.gain >= 2.0;
  const w = v => Math.max(2, Math.min(100, v)).toFixed(0);
  const verdict = good ? "예측이 낫습니다"
    : s.gain <= -1 ? "흔한 값이 낫습니다" : "흔한 값과 비슷합니다";
  const col = good ? "var(--ok)" : "var(--ink-faint)";
  return `<div class="col" style="gap:6px">
    <div class="row" style="align-items:baseline">
      <span class="small">${esc(m.label)}</span>
      <span class="tiny" style="color:${col}">${esc(verdict)}</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="tiny muted" style="width:48px">이 예측</span>
      <span style="flex-grow:1;height:5px;background:var(--surface-2);border-radius:3px;display:flex">
        <i style="width:${w(s.hit)}%;background:${col};border-radius:3px"></i></span>
      <span class="num tiny" style="width:34px;text-align:right;color:${col}">${s.hit.toFixed(0)}%</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="tiny muted" style="width:48px">흔한 값</span>
      <span style="flex-grow:1;height:5px;background:var(--surface-2);border-radius:3px;display:flex">
        <i style="width:${w(s.base)}%;background:var(--line-2);border-radius:3px"></i></span>
      <span class="num tiny muted" style="width:34px;text-align:right">${s.base.toFixed(0)}%</span>
    </div>
  </div>`;
}

function empty(title, sub) {
  return `<div class="card pad col" style="gap:6px;margin-top:40px;text-align:center">
    <b>${esc(title)}</b><span class="small muted">${esc(sub)}</span></div>`;
}

document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener("click", () => { tab = b.dataset.tab; render(); }));
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
/* ── 알림 ─────────────────────────────────────────────────
   안드로이드 크롬은 홈 화면 추가 없이 바로 된다.
   아이폰은 애플이 '홈 화면에 추가된 웹앱'에만 알림을 허용한다 —
   사파리 탭에서는 PushManager 자체가 없어서 버튼을 띄울 수가 없다.
   그 경우 버튼 대신 캘린더 구독을 안내한다.                        */
const VAPID = "BONURGysUpCKz68_RBcEh-EAsrvC7pWOPh9NhRZImNJA1s5Y8VXuRI679fCzlOExsp7XTHwbTsisBwmMFaGMEEQ";
const notifBox = document.getElementById("notif");
let pushOK = null;   // /api/health 결과. null 이면 아직 모른다.

function isiOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.userAgent.includes("Mac") && "ontouchend" in document);
}
function installed() {
  return window.navigator.standalone === true ||
         window.matchMedia("(display-mode: standalone)").matches;
}
// 카톡·네이버 앱 안에서 열렸는지. 앱 내 브라우저는 알림을 켤 수 없다.
// 안드로이드 카톡은 WebView 라 푸시 등록 자체가 안 되고, 아이폰 카톡에는
// '홈 화면에 추가' 가 있는 공유 버튼이 없다. 그런데도 버튼을 보여주면
// 눌러도 안 되는 것을 눌러보게 만든다.
function inAppBrowser() {
  const ua = navigator.userAgent;
  if (/KAKAOTALK/i.test(ua)) return "카카오톡";
  if (/NAVER\(inapp/i.test(ua)) return "네이버 앱";
  if (/Instagram|FBAN|FBAV/i.test(ua)) return "SNS 앱";
  if (/Line\//i.test(ua)) return "라인";
  if (/DaumApps|everytimeApp/i.test(ua)) return "앱 내 브라우저";
  // 안드로이드 WebView 공통 표식. 위에서 안 걸린 앱들을 잡는다.
  if (/; wv\)/.test(ua)) return "앱 내 브라우저";
  return null;
}

function canPush() {
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}
function b64ToBytes(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

// 캘린더는 webcal:// 로 열어야 '구독'이 된다. https 로 열면 그 순간의 일정을
// 한 번 복사하고 끝나서, 경기가 취소되거나 시간이 바뀌어도 반영되지 않는다.
function calLink() {
  const dir = location.pathname.replace(/[^/]*$/, "");
  return "webcal://" + location.host + dir + "starball.ics";
}
const calHtml = () => `<a href="${calLink()}">캘린더로 받기</a>`;

async function renderNotif() {
  if (pushOK === null) {
    try {
      const r = await fetch("api/health", { cache: "no-store" });
      pushOK = r.ok ? (await r.json()).kv === true : false;
    } catch { pushOK = false; }
  }

  // 앱 내 브라우저가 가장 먼저다. 여기서 걸러내지 않으면 아래 분기들이
  // 있지도 않은 버튼('사파리 아래 공유')을 안내하게 된다.
  const app = inAppBrowser();
  if (app && !installed()) {
    notifBox.innerHTML = card(`${app} 안에서 열렸어요`,
      `알림을 받으려면 브라우저로 열어야 합니다.<br>
       <b>아이폰</b> 오른쪽 아래 <b>⋯</b> → <b>Safari로 열기</b><br>
       <b>안드로이드</b> 오른쪽 위 <b>⋮</b> → <b>다른 브라우저로 열기</b><br>
       <span class="muted">브라우저로 열기 어려우시면 ${calHtml()} — 여기서도 됩니다.</span>`);
    return;
  }

  // 아이폰은 애플 정책상 홈 화면에 추가된 웹앱에만 알림이 허용된다.
  // 사파리 탭에서는 PushManager 자체가 없어 켤 방법이 없다.
  if (isiOS() && !installed()) {
    notifBox.innerHTML = card("알림으로 받으시려면",
      `사파리 아래 <b>공유</b> → <b>홈 화면에 추가</b> 후 아이콘으로 열어주세요.
       그게 번거로우시면 ${calHtml()} — 경기 2시간 전에 기본 캘린더가 알려줍니다.`);
    return;
  }
  if (!pushOK || !canPush()) {
    notifBox.innerHTML = card("경기일 알림 받기",
      `${calHtml()} 를 누르면 남은 경기가 캘린더에 들어가고,
       경기 2시간 전에 알림이 뜹니다.`);
    return;
  }
  if (Notification.permission === "denied") {
    notifBox.innerHTML = card("알림이 차단되어 있어요",
      `브라우저 설정에서 이 사이트의 알림을 허용해 주세요. 또는 ${calHtml()}.`);
    return;
  }
  const sub = await currentSub();
  if (sub) {
    notifBox.innerHTML = `<div class="notif on"><span class="tiny">
      경기일 아침과 마감 2시간 전에 알림이 갑니다</span>
      <button class="linky tiny" id="notifOff">끄기</button></div>`;
    document.getElementById("notifOff").onclick = () => turnOff(sub);
    return;
  }
  notifBox.innerHTML = `<div class="notif"><span class="tiny">
    경기일에 추천값을 알림으로 받으시겠어요?<br>
    <span class="muted">또는 ${calHtml()}</span></span>
    <button class="btn tiny" id="notifOn">알림 받기</button></div>`;
  document.getElementById("notifOn").onclick = turnOn;
}

async function currentSub() {
  if (!canPush()) return null;
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    return reg ? await reg.pushManager.getSubscription() : null;
  } catch { return null; }
}

function card(title, html) {
  return `<div class="notif col" style="gap:3px;align-items:flex-start">
    <b class="tiny">${title}</b><span class="tiny muted">${html}</span></div>`;
}

async function turnOn() {
  const btn = document.getElementById("notifOn");
  btn.disabled = true; btn.textContent = "설정 중…";
  try {
    // 권한 요청은 클릭 안에서 해야 한다. 로딩 중에 미리 물으면 차단당한다.
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { await renderNotif(); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID) });
    const r = await fetch("api/subscribe", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(sub.toJSON()) });
    if (!r.ok) throw new Error(await r.text());
    // 켠 직후 확인 알림을 한 번 띄운다. 됐는지 안 됐는지 알 수 없으면
    // 다음 경기까지 기다렸다가 안 오는 것을 확인하게 된다.
    reg.showNotification("스타볼 알림이 켜졌어요", {
      body: "경기일 아침과 마감 2시간 전에 추천값을 보내드립니다.",
      icon: "icon-192.png", badge: "icon-192.png", tag: "starball" });
  } catch (e) {
    notifBox.innerHTML = card("알림을 켜지 못했어요",
      `잠시 후 다시 시도해 주세요. (${String(e.message || e).slice(0, 80)})`);
    return;
  }
  await renderNotif();
}

async function turnOff(sub) {
  try {
    await fetch("api/unsubscribe", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ endpoint: sub.endpoint }) });
    await sub.unsubscribe();
  } catch {}
  await renderNotif();
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(renderNotif).catch(() => { renderNotif(); });
} else {
  renderNotif();
}
</script>
</body>
</html>
